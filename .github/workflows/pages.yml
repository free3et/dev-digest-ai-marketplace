name: Catalog site

# Builds and publishes the catalog UI (site/). Independent from "Validate marketplace",
# which only lints the plugin files. Each job below shows up as its own check on a pull request.
#
# Pull requests always run the checks (no path filter): "Site tests" and "Build site" are required
# status checks, and a required check that never starts would block every PR that touches other files.
# Pushes to main only redeploy when something the site is built from has changed.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'scripts/catalog.mjs'
      - 'scripts/lib.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Site tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git history gives per-file update dates
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site (indexes the repository into catalog.json)
        run: npm run build
      - name: Summarize the catalog
        run: |
          {
            echo '### Catalog index'
            echo '```'
            node scripts/catalog.mjs
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
