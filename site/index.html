<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dev Digest Catalog</title>
<meta name="description" content="Catalog of plugins, skills, agents, commands, hooks and MCP servers in the dev-digest marketplace for Claude Code.">
<meta name="theme-color" content="#0d1016">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<script>try{if(localStorage.getItem('dd-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
</head>
<body>
<div id="root"></div>
<script>
// The app is an ES module that loads catalog.json, so it needs an HTTP server. Say so instead of showing a blank page.
if (location.protocol === 'file:') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('root').innerHTML =
    '<div style="max-width:640px;margin:15vh auto;padding:0 20px;font:16px/1.6 system-ui,sans-serif;color:#e7ebf2">' +
    '<h1 style="font-size:24px;margin:0 0 12px">Open the catalog through a local server</h1>' +
    '<p style="color:#a4afc2;margin:0 0 12px">Browsers do not run modules or load data from <code>file://</code>. From the repository root run:</p>' +
    '<pre style="background:#141922;border:1px solid #262e3d;border-radius:9px;padding:12px 14px;margin:0 0 12px">npm install\nnpm run dev</pre>' +
    '<p style="color:#a4afc2;margin:0">Then open <code>http://localhost:5173</code>.</p></div>';
  document.body.style.cssText = 'margin:0;background:#0d1016';
}
</script>
<noscript><p style="padding:24px">The catalog needs JavaScript to run.</p></noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
